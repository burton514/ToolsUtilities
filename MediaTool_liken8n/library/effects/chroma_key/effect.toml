# Gói hiệu ứng MediaTool — xem docs/LIBRARY.md

[effect]
id = "chroma_key"
name = "Xóa phông xanh"
category = "key"
kind = "effect"
description = "Xóa phông xanh lá / xanh dương, giữ người và vật."
sample_radius = 0
order = 1

[[param]]
key = "key"
label = "Màu phông"
type = "color"
default = "#00FF00"

[[param]]
key = "similarity"
label = "Độ giống"
type = "float"
min = 0
max = 1
step = 0.01
default = 0.4

[[param]]
key = "smoothness"
label = "Mềm viền"
type = "float"
min = 0
max = 1
step = 0.01
default = 0.1

[[param]]
key = "spill"
label = "Khử ám màu"
type = "float"
min = 0
max = 1
step = 0.01
default = 0.6
