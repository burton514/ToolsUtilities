# Gói hiệu ứng MediaTool — xem docs/LIBRARY.md

[effect]
id = "shake"
name = "Rung máy"
category = "distort"
kind = "effect"
description = "Khung hình rung như cầm máy tay, động đất."
sample_radius = 70
order = 4

[[param]]
key = "amount"
label = "Độ rung"
type = "float"
min = 0
max = 60
step = 0.5
default = 14
unit = "px"

[[param]]
key = "speed"
label = "Tốc độ"
type = "float"
min = 1
max = 40
step = 0.5
default = 14
