[package]
name = "mediatool-desktop"
version = "0.1.0"
edition = "2021"
description = "App desktop MediaTool: nhúng core Rust, giao diện là workspace/sandbox"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mediatool-api = { path = "../../core/crates/api" }

[features]
custom-protocol = ["tauri/custom-protocol"]
