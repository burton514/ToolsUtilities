# Chuỗi đã lưu: core đọc chain.json và chạy từng bước thành job con. Không có code riêng.
[tool]
id          = "compose_auto_captions"
name        = "Phụ đề tự động"
version     = "0.3.0"
sdk         = ">=0.1,<0.2"
entry       = "chain:chain.json"
summary     = "Một bước ra video có phụ đề: tự nghe lời nói (tiếng Việt, Anh và ngoại ngữ khác) rồi chèn phụ đề kiểu TikTok (từ đang nói đổi màu), karaoke hoặc phụ đề thường."
tags        = ["chain", "subtitle", "tiktok", "caption", "speech"]
owners      = ["mediatool-core"]
license     = "MIT"
status      = "beta"

[runtime]
profile     = "base"
ram_mb      = 50
gpu         = "none"
heavy       = false
timeout_s   = 10800

[mcp]
expose      = true
hint        = "Dùng khi người dùng muốn video có phụ đề mà chưa có file phụ đề (ví dụ: làm phụ đề TikTok cho video nói chuyện). Chọn đúng language. Đã có file .srt thì dùng compose_bind."

[[examples]]
title       = "Video nói tiếng Anh → phụ đề TikTok"
inputs      = { video = "samples/talk.mp4" }
params      = { language = "en", style = "tiktok", quality = "draft" }

[[examples]]
title       = "Video nói tiếng Việt → phụ đề TikTok"
inputs      = { video = "samples/talk_vi.mp4" }
params      = { language = "vi", style = "tiktok", quality = "draft" }
