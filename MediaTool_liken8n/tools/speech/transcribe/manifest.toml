# PhoWhisper (VinAI Research, BSD-3-Clause) — Whisper tinh chỉnh trên 844 giờ tiếng Việt nhiều vùng miền.
# small: bản CTranslate2 int8 (chỉ chuyển đổi, không đổi trọng số); medium: bản CTranslate2 fp16 từ commit 55a7e3eb của VinAI
