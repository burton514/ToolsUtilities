[tool]
id          = "speech_transcribe"
name        = "Chuyển giọng nói thành chữ"
version     = "0.3.1"
sdk         = ">=0.1,<0.2"
entry       = "tool:SpeechTranscribeTool"
summary     = "Nghe video / audio và chép lời thành phụ đề .srt kèm thời gian từng từ. Tiếng Việt dùng PhoWhisper (VinAI), tiếng Anh và ngoại ngữ dùng Whisper; chạy ngay trên máy, không gửi đi đâu."
tags        = ["speech", "transcribe", "subtitle", "whisper", "phowhisper", "asr", "vietnamese"]
owners      = ["mediatool-core"]
license     = "MIT"
status      = "beta"
# Nguồn hiện cạnh tên tool (repo model / thư viện / engine)
sources     = [
  { name = "vinai/PhoWhisper", url = "https://github.com/VinAIResearch/PhoWhisper" },
  { name = "SYSTRAN/faster-whisper", url = "https://github.com/SYSTRAN/faster-whisper" },
]

[runtime]
profile     = "base"
ram_mb      = 2500
gpu         = "optional"
heavy       = true
timeout_s   = 7200

[dependencies]
binaries    = ["ffmpeg"]

# Mỗi ngôn ngữ một bộ model (bảng chọn trong tool.py): tiếng Việt → PhoWhisper, còn lại → Whisper. Ghim theo commit, kiểm sha256.

# Whisper (OpenAI, MIT) bản CTranslate2 của Systran (MIT).
[[models]]
id          = "whisper_base"
size_mb     = 145
license     = "MIT"
source      = "https://huggingface.co/Systran/faster-whisper-base"
files = [
  { path = "model.bin",      url = "https://huggingface.co/Systran/faster-whisper-base/resolve/ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66/model.bin",      sha256 = "d01c3014881c9c6f3133c182f3d2887eb6ca1c789a7538c5c007196857a0a6a9" },
  { path = "config.json",    url = "https://huggingface.co/Systran/faster-whisper-base/resolve/ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66/config.json",    sha256 = "56a6d8110d311f19c8f0471e562832c7527f146b567275bfca59fcf7c184da9a" },
  { path = "tokenizer.json", url = "https://huggingface.co/Systran/faster-whisper-base/resolve/ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66/tokenizer.json", sha256 = "fb7b63191e9bb045082c79fd742a3106a12c99513ab30df4a0d47fa6cb6fd0ab" },
  { path = "vocabulary.txt", url = "https://huggingface.co/Systran/faster-whisper-base/resolve/ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66/vocabulary.txt", sha256 = "34ce3fe1c5041027b3f8d42912270993f986dbc4bb34cf27f951e34a1e453913" },
]

[[models]]
id          = "whisper_small"
size_mb     = 465
