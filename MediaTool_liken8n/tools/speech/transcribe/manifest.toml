[mcp]
expose      = true
hint        = "Dùng khi cần phụ đề / lời thoại từ video hoặc audio có người nói (tiếng Việt, Anh, Trung, Nhật, Hàn, Thái, Pháp, Đức, Tây Ban Nha). Chọn đúng 'language'. Output 'subtitle' (.srt), 'text' (.txt) và 'transcript' (thời gian từng từ) nối thẳng vào compose_bind / speech_dub."

[[examples]]
title       = "Chép lời đoạn nói tiếng Việt (PhoWhisper)"
inputs      = { media = "samples/speech_vi.mp3" }
params      = { model = "base", language = "vi" }

[[examples]]
title       = "Chép lời đoạn nói tiếng Anh (Whisper)"
inputs      = { media = "samples/speech.mp3" }
params      = { model = "base", language = "en" }

[[examples]]
title       = "Video nói chuyện → phụ đề ngắn kiểu TikTok (tối đa 18 ký tự mỗi dòng)"
inputs      = { media = "samples/talk.mp4" }
params      = { model = "base", language = "en", max_chars = 18 }
