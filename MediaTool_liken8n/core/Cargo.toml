[workspace]
resolver = "2"
members = ["crates/registry", "crates/storage", "crates/jobs", "crates/api", "crates/engine", "bin/server", "bin/render"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: giữ thứ tự khóa JSON như tool khai báo (tham số hiện đúng thứ tự tác giả sắp, không theo bảng chữ cái)
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
axum = { version = "0.7", features = ["multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
jsonschema = { version = "=0.18.3", default-features = false }

mediatool-registry = { path = "crates/registry" }
mediatool-storage = { path = "crates/storage" }
mediatool-jobs = { path = "crates/jobs" }
mediatool-api = { path = "crates/api" }
mediatool-engine = { path = "crates/engine" }
