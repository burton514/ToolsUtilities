[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediatool-sdk"
version = "0.1.0"
description = "MediaTool SDK: hợp đồng giữa core và tool (BaseTool, Context, kiểu asset, CLI mediatool-dev)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mediatool-dev = "mediatool_sdk.dev.cli:main"

[tool.setuptools.packages.find]
include = ["mediatool_sdk*"]
